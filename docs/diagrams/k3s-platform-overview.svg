<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">K3s on AWS single-node platform architecture</title>
  <desc id="desc">Terraform and Terragrunt provision an AWS VPC and EC2 instance. AWS Systems Manager installs K3s. Traefik, cert-manager and Argo CD run as Helm-managed platform services with application workloads on the same K3s node.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#13233a"/></linearGradient>
    <linearGradient id="aws" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172b4d"/><stop offset="1" stop-color="#0f1d33"/></linearGradient>
    <linearGradient id="ec2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb84d"/><stop offset="1" stop-color="#ff8a1f"/></linearGradient>
    <linearGradient id="k3s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#48c78e"/><stop offset="1" stop-color="#1f9d72"/></linearGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#5a3ed6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".24"/></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52b6ff"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62d7a5"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb84d"/></marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#f8fbff}.subtitle{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#a9bdd3}.section{font:700 16px Inter,Segoe UI,Arial,sans-serif;fill:#dfeaff;letter-spacing:.4px}.label{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#f8fbff}.small{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#c9d8e8}.tiny{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#a9bdd3}.dark{fill:#172033}.line-blue{stroke:#52b6ff;stroke-width:3;fill:none;marker-end:url(#arrowBlue)}.line-green{stroke:#62d7a5;stroke-width:3;fill:none;marker-end:url(#arrowGreen)}.line-orange{stroke:#ffb84d;stroke-width:3;fill:none;marker-end:url(#arrowOrange)}.dash{stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/><circle cx="1450" cy="80" r="180" fill="#2d4d7a" opacity=".12"/><circle cx="120" cy="840" r="220" fill="#5a3ed6" opacity=".09"/>
  <text x="70" y="72" class="title">K3s on AWS — Single-node Platform Architecture</text><text x="70" y="102" class="subtitle">Current repository profile: separate VPC, EC2 and K3s lifecycle modules with Helm-managed platform services</text>
  <rect x="65" y="142" width="1470" height="108" rx="20" fill="#0d1a2b" stroke="#29415d" stroke-width="2"/><text x="90" y="174" class="section">PROVISIONING &amp; MANAGEMENT PLANE</text>
  <g filter="url(#shadow)"><rect x="95" y="188" width="210" height="44" rx="12" fill="#1c314d" stroke="#3e628d"/><text x="200" y="216" text-anchor="middle" class="label">Terraform / Terragrunt</text><rect x="390" y="188" width="170" height="44" rx="12" fill="#1c314d" stroke="#3e628d"/><text x="475" y="216" text-anchor="middle" class="label">S3 Remote State</text><rect x="645" y="188" width="190" height="44" rx="12" fill="#1c314d" stroke="#3e628d"/><text x="740" y="216" text-anchor="middle" class="label">AWS Systems Manager</text><rect x="920" y="188" width="175" height="44" rx="12" fill="#1c314d" stroke="#3e628d"/><text x="1007.5" y="216" text-anchor="middle" class="label">Helm</text><rect x="1180" y="188" width="225" height="44" rx="12" fill="#1c314d" stroke="#3e628d"/><text x="1292.5" y="216" text-anchor="middle" class="label">kubectl / CI / Operator</text></g>
  <path d="M305 210 H390" class="line-blue"/><path d="M560 210 H645" class="line-blue"/><path d="M835 210 H920" class="line-blue"/><path d="M1095 210 H1180" class="line-blue"/>
  <g filter="url(#shadow)"><rect x="70" y="340" width="210" height="130" rx="18" fill="#14263d" stroke="#3f6388" stroke-width="2"/><text x="175" y="377" text-anchor="middle" class="label">Users / Clients</text><text x="175" y="406" text-anchor="middle" class="small">HTTPS application traffic</text><text x="175" y="434" text-anchor="middle" class="tiny">Internet / internal consumers</text></g>
  <g filter="url(#shadow)"><rect x="335" y="292" width="1195" height="510" rx="28" fill="url(#aws)" stroke="#31567f" stroke-width="2"/><rect x="365" y="320" width="1135" height="452" rx="24" fill="#0d1828" stroke="#284661" stroke-width="2"/><text x="375" y="318" class="section">AWS CLOUD</text><text x="395" y="355" class="section">VPC · PUBLIC SUBNET</text><rect x="395" y="380" width="150" height="76" rx="16" fill="#18324f" stroke="#52b6ff" stroke-width="2"/><text x="470" y="410" text-anchor="middle" class="label">Elastic IP</text><text x="470" y="437" text-anchor="middle" class="small">80 / 443 / 6443</text>
    <rect x="590" y="370" width="860" height="360" rx="24" fill="#101c2d" stroke="#ff9f2f" stroke-width="3"/><rect x="590" y="370" width="860" height="54" rx="24" fill="url(#ec2)"/><rect x="590" y="405" width="860" height="19" fill="url(#ec2)"/><text x="620" y="404" class="dark" style="font:700 20px Inter,Segoe UI,Arial,sans-serif;">EC2 · Amazon Linux 2023 · encrypted gp3 · IMDSv2</text>
    <rect x="625" y="455" width="360" height="230" rx="20" fill="#11293a" stroke="#42bf8a" stroke-width="2.5"/><rect x="625" y="455" width="360" height="50" rx="20" fill="url(#k3s)"/><rect x="625" y="487" width="360" height="18" fill="url(#k3s)"/><text x="805" y="487" text-anchor="middle" class="label">K3s Server + Worker</text><text x="650" y="535" class="small">• kube-apiserver / scheduler / controllers</text><text x="650" y="565" class="small">• SQLite datastore (single-server default)</text><text x="650" y="595" class="small">• kubelet + containerd + CNI</text><text x="650" y="625" class="small">• CoreDNS + local-path storage</text><text x="650" y="655" class="small">• K3s bundled Traefik disabled</text>
    <rect x="1020" y="455" width="395" height="230" rx="20" fill="#151f3d" stroke="#7c5cff" stroke-width="2.5"/><rect x="1020" y="455" width="395" height="50" rx="20" fill="url(#platform)"/><rect x="1020" y="487" width="395" height="18" fill="url(#platform)"/><text x="1217.5" y="487" text-anchor="middle" class="label">Helm-managed Platform Services</text><rect x="1045" y="530" width="105" height="70" rx="14" fill="#1d3350" stroke="#52b6ff"/><text x="1097.5" y="558" text-anchor="middle" class="label">Traefik</text><text x="1097.5" y="583" text-anchor="middle" class="tiny">Ingress</text><rect x="1165" y="530" width="105" height="70" rx="14" fill="#2b274b" stroke="#9b7cff"/><text x="1217.5" y="558" text-anchor="middle" class="label">cert-manager</text><text x="1217.5" y="583" text-anchor="middle" class="tiny">TLS / ACME</text><rect x="1285" y="530" width="105" height="70" rx="14" fill="#3a283c" stroke="#f19ac7"/><text x="1337.5" y="558" text-anchor="middle" class="label">Argo CD</text><text x="1337.5" y="583" text-anchor="middle" class="tiny">GitOps</text><rect x="1045" y="620" width="345" height="44" rx="12" fill="#123b33" stroke="#62d7a5"/><text x="1217.5" y="648" text-anchor="middle" class="label">Application Pods / Services</text></g>
  <path d="M280 405 H395" class="line-green"/><path d="M545 418 H590" class="line-green"/><path d="M985 566 H1045" class="line-green"/><path d="M1097 600 V620" class="line-green"/>
  <path d="M740 232 V300 H760 V455" class="line-orange dash"/><text x="770" y="320" class="tiny">install / configure K3s via SSM</text><path d="M1008 232 V320 H1200 V455" class="line-blue dash"/><text x="1030" y="310" class="tiny">deploy pinned charts</text><path d="M1292 232 V300 H900 V455" class="line-blue dash"/><text x="1130" y="286" class="tiny">kubectl / API access</text>
  <text x="292" y="392" class="tiny">HTTPS</text><text x="555" y="406" class="tiny">EIP</text><text x="995" y="548" class="tiny">cluster network</text>
  <rect x="65" y="824" width="1470" height="48" rx="14" fill="#0d1a2b" stroke="#29415d"/><circle cx="95" cy="848" r="6" fill="#52b6ff"/><text x="110" y="853" class="tiny">management / control</text><circle cx="265" cy="848" r="6" fill="#62d7a5"/><text x="280" y="853" class="tiny">runtime traffic</text><circle cx="420" cy="848" r="6" fill="#ffb84d"/><text x="435" y="853" class="tiny">bootstrap via SSM</text><text x="1490" y="853" text-anchor="end" class="tiny">Current profile: single EC2 · no node-level HA</text>
</svg>
